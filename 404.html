<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — PageUp</title>
  <meta name="theme-color" content="#226db4">
  <!-- Self-contained on purpose: a 404 can be served from any path depth, so
       this page loads no external CSS or JS and cannot break on a subpath. -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='6' fill='%23226db4'/><path d='M7 17.5A1.5 1.5 0 0 1 8.5 16H17V6H8.5A1.5 1.5 0 0 0 7 7.5z' fill='white'/></svg>">
  <style>
    :root {
      --brand: #226db4; --brand-600: #1b5a96; --navy: #0f3355;
      --bg: #f5f7fa; --surface: #fff; --border: #e1e6ec;
      --text: #16202b; --text-2: #5a6675; --text-3: #8a95a3;
      --font: "Zoho Puvi", "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #0e1620; --surface: #16202b; --border: #2b3a4b; --text: #eaf0f6; --text-2: #aebbc9; --text-3: #7f8d9d; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--text);
      font-family: var(--font); font-size: 14px; line-height: 1.55;
      -webkit-font-smoothing: antialiased; padding: 24px;
    }
    .card {
      max-width: 480px; width: 100%; text-align: center;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 40px 32px;
      box-shadow: 0 1px 2px rgba(16, 32, 56, .05);
    }
    .mark {
      width: 46px; height: 46px; border-radius: 10px; margin: 0 auto 20px;
      background: var(--brand); display: grid; place-items: center; color: #fff;
    }
    .mark svg { width: 24px; height: 24px; }
    h1 { font-size: 22px; font-weight: 700; letter-spacing: -.02em; margin: 0 0 8px; }
    p { color: var(--text-2); margin: 0 0 6px; }
    code {
      font-size: 12.5px; background: var(--bg); border: 1px solid var(--border);
      padding: 1px 5px; border-radius: 4px; color: var(--text-2);
    }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      height: 38px; padding: 0 18px; margin-top: 22px;
      border-radius: 6px; background: var(--brand); color: #fff;
      font-weight: 600; font-size: 13.5px; text-decoration: none;
    }
    .btn:hover { background: var(--brand-600); }
    .btn svg { width: 16px; height: 16px; }
    .brand { font-size: 12px; color: var(--text-3); margin-top: 22px; letter-spacing: .04em; text-transform: uppercase; font-weight: 700; }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
      </svg>
    </div>
    <h1>404 &mdash; that page slipped out of the book</h1>
    <p>The link you followed does not point to anything on PageUp.</p>
    <p><code id="missing"></code></p>
    <a class="btn" href="./index.html" id="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      Back to the catalogue
    </a>
    <div class="brand">PageUp</div>
  </main>

  <script>
    /* Resolve the site root so this works from a domain root, a project
       subpath (/repo/...) or any nesting depth, with no external assets. */
    (function () {
      var segments = location.pathname.split('/').filter(Boolean);
      var isProjectPage = /\.github\.io$/i.test(location.hostname) && segments.length > 1;
      var root = isProjectPage ? '/' + segments[0] + '/' : '/';
      document.getElementById('home').setAttribute('href', root + 'index.html');
      document.getElementById('missing').textContent = location.pathname;
    })();
  </script>
</body>
</html>
